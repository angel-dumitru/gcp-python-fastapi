steps:
  # Step 1: Build Docker Image
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/my-app:latest", "."]

  # Step 2: Push Docker Image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/my-app:latest"]

  # Step 3: Run Unit Tests
  - name: "python:3.12"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install --upgrade pip
        pip install -r requirements.txt
        pytest tests/

 # Step 4: Scan Docker Image with Trivy & Save Report
  - name: "aquasec/trivy"
    args: [
      "image", 
      "--exit-code", "0", 
      "--format", "json", 
      "--output", "/workspace/trivy-container-report.json", 
      "gcr.io/$PROJECT_ID/my-app:latest"
    ]

  # Step 5: Snyk Code Scanning & Save Report
  - name: "node"
    entrypoint: "bash"
    secretEnv: ["SNYK_TOKEN"]
    args:
      - "-c"
      - |
        npm install -g snyk
        snyk auth $$SNYK_TOKEN
        # Scan code and write output directly to a file
        snyk code test --json-file-output=/workspace/snyk-code-report.json || true

# Step 6: Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud run deploy gcp-python-fastapi-service \
        --image gcr.io/$PROJECT_ID/my-app:latest \
        --region us-central1 \
        --platform managed

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

artifacts:
  objects:
    location: "gs://12309861-21233"
    paths: 
      - "/workspace/trivy-container-report.json"
      - "/workspace/snyk-code-report.json"
      
availableSecrets:
  secretManager:
    - versionName: projects/140304896915/secrets/cloudbuild-snyk-token/versions/1
      env: "SNYK_TOKEN"
